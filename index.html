<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ForgeVision" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ForgeVision · 推想视限</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body data-theme="light">

<!-- ============================ 侧栏 ============================ -->
<aside class="sidebar" id="sidebar" aria-label="会话列表">
  <div class="sb-head">
    <div class="sb-brand">
      <span class="sb-logo" aria-label="AFV">AFV</span>
      <span class="sb-ready" id="sbReady"><i class="dot"></i>SESSION READY</span>
    </div>
    <button class="sb-ghost" data-action="close-sidebar" aria-label="收起侧栏">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
    </button>
  </div>

  <div class="sb-plate" aria-hidden="true">
    <div class="sb-spine">FORGE VISION</div>
    <div class="sb-plate-inner">
      <div class="sb-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 38 24 8l16 30h-9l-7-13-7 13z" />
          <path d="M17 38h14" />
        </svg>
      </div>
      <div class="sb-plate-text">
        <strong>推想视限</strong>
        <span>LOCAL FIRST / v0.1</span>
      </div>
    </div>
  </div>

  <div class="sb-panel">
    <button class="sb-row" data-action="open-settings" title="模型与接口">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v3M8 11v3M2 8h3M11 8h3" /><circle cx="8" cy="8" r="2.6" /></svg>
      <span class="sb-row-label">模型</span>
      <b class="sb-row-value" id="sbModel">deepseek-chat</b>
    </button>
    <button class="sb-row" data-action="open-settings" title="存储与备份">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="3.2" /><path d="M3.5 6.2v6.3h9V6.2M6 9h4" /></svg>
      <span class="sb-row-label">存储</span>
      <b class="sb-row-value" id="sbStore">本机</b>
    </button>
  </div>

  <div class="sb-search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2" /><path d="m10.2 10.2 3 3" /></svg>
    <input id="searchInput" type="search" placeholder="搜索对话…" autocomplete="off" />
  </div>

  <div class="sb-scroll">
    <div class="sb-group-head">
      <span>对话</span>
      <span class="sb-group-actions">
        <button class="sb-mini" data-action="new-chat" title="新对话">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
        </button>
      </span>
    </div>
    <div class="sb-list" id="sessionList"></div>
    <div class="sb-empty" id="sessionEmpty" hidden>还没有对话，点上面的 ＋ 开始</div>
  </div>

  <div class="sb-foot">
    <button class="sb-fbtn" data-action="new-chat" title="新对话"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></svg></button>
    <button class="sb-fbtn" data-action="open-settings" title="设置"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" /><path d="M10 2.6v2.2M10 15.2v2.2M2.6 10h2.2M15.2 10h2.2M4.8 4.8l1.6 1.6M13.6 13.6l1.6 1.6M15.2 4.8l-1.6 1.6M6.4 13.6l-1.6 1.6" /></svg></button>
    <button class="sb-fbtn" data-action="toggle-theme" title="主题"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" stroke="none" /></svg></button>
    <button class="sb-fbtn" data-action="collapse" title="折叠"><svg viewBox="0 0 20 20"><path d="M3.5 10h13M9 6l-3.5 4L9 14" /></svg></button>
  </div>
  <div class="sb-user">
    <div class="sb-avatar">AFV</div>
    <div class="sb-user-text">
      <b id="sbUserName">本地用户</b>
      <span id="sbUserSub">数据只在这台设备</span>
    </div>
  </div>
</aside>

<div class="scrim" id="scrim" hidden></div>

<!-- ============================ 主区 ============================ -->
<main class="main" id="main">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">
      <svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14" /></svg>
    </button>
    <div class="tb-title" id="chatTitle">新对话</div>
    <div class="tb-actions">
      <button class="model-chip" id="modelChip" aria-haspopup="listbox">
        <span id="modelChipLabel">deepseek-chat</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6.5 4 4 4-4" /></svg>
      </button>
      <button class="icon-btn" data-action="new-chat" aria-label="新对话">
        <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></svg>
      </button>
      <button class="icon-btn" id="moreBtn" aria-label="更多">
        <svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.4" /><circle cx="10" cy="10" r="1.4" /><circle cx="15" cy="10" r="1.4" /></svg>
      </button>
    </div>
  </header>

  <div class="chat-scroll" id="chatScroll">
    <section class="hero" id="hero">
      <div class="hero-eyebrow">
        <span class="hero-eyebrow-line"></span>
        <span>FORGEVISION</span>
        <span class="hero-eyebrow-line"></span>
      </div>
      <h1 class="hero-type">
        <span id="heroText"></span><i class="hero-caret" aria-hidden="true"></i>
      </h1>
      <div class="hero-meta"><span>AFV.01A</span><span class="hero-meta-rule"></span></div>
      <div class="hero-chips" id="heroChips">
        <button class="chip" data-prompt="帮我规划一周的写作计划">帮我规划一周的写作计划</button>
        <button class="chip" data-prompt="用一句话解释什么是向量数据库">什么是向量数据库</button>
        <button class="chip" data-prompt="把这段话改得更简洁有力：">帮我润色一段文字</button>
      </div>
    </section>
    <div class="flow" id="flow"></div>
  </div>

  <div class="composer-seat" id="composerSeat">
    <div class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="给 ForgeVision 发送消息…" enterkeyhint="send" autocomplete="off"></textarea>
      <div class="composer-tools">
        <div class="ct-left">
          <button class="tool-btn" id="attachBtn" title="附加文本文件">
            <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></svg>
          </button>
          <button class="tool-btn tool-model" id="toolModel" aria-haspopup="listbox">
            <span id="toolModelLabel">deepseek-chat</span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6.5 4 4 4-4" /></svg>
          </button>
        </div>
        <div class="ct-right">
          <button class="send-btn" id="stopBtn" hidden title="停止生成">
            <svg viewBox="0 0 20 20"><rect x="6" y="6" width="8" height="8" rx="1" /></svg>
          </button>
          <button class="send-btn" id="sendBtn" title="发送" disabled>
            <svg viewBox="0 0 20 20"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5" /></svg>
          </button>
        </div>
      </div>
    </div>
    <p class="disclaimer">内容由 AI 生成，请仔细甄别</p>
  </div>
</main>

<!-- ============================ 设置 ============================ -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-head">
      <h2>设置</h2>
      <button class="icon-btn" id="settingsClose" aria-label="关闭"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15" /></svg></button>
    </div>
    <div class="modal-body">
      <section class="set-block" id="setKeyBlock">
        <label class="set-label" for="setKey">DeepSeek API Key</label>
        <input class="set-input" id="setKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" />
        <p class="set-hint" id="setKeyHint">只保存在这台设备。</p>
      </section>

      <section class="set-block" id="setPwdBlock" hidden>
        <label class="set-label" for="setPwd">访问密码</label>
        <input class="set-input" id="setPwd" type="password" placeholder="本机服务的访问密码" autocomplete="off" />
      </section>

      <section class="set-block">
        <label class="set-label">模型</label>
        <div class="seg" id="setModels"></div>
      </section>

      <section class="set-block">
        <label class="set-label">外观</label>
        <div class="seg" id="setTheme">
          <button data-theme="light">浅色</button>
          <button data-theme="dark">深色</button>
          <button data-theme="auto">跟随系统</button>
        </div>
      </section>

      <section class="set-block">
        <label class="set-label">正文字号</label>
        <input type="range" id="setFont" min="14" max="20" step="1" value="16" />
      </section>

      <section class="set-block">
        <label class="set-label">数据</label>
        <div class="set-actions">
          <button class="set-btn" id="exportBtn">导出全部</button>
          <button class="set-btn" id="importBtn">导入</button>
          <button class="set-btn danger" id="clearBtn">清空本机对话</button>
        </div>
        <p class="set-hint" id="setStoreHint"></p>
      </section>
    </div>
  </div>
</div>

<!-- ============================ 解锁 ============================ -->
<div class="lock" id="lock" hidden>
  <div class="lock-card">
    <div class="lock-logo">AFV</div>
    <h2>推想视限</h2>
    <p>输入访问密码继续</p>
    <input id="lockInput" type="password" placeholder="访问密码" autocomplete="current-password" />
    <button id="lockBtn">进入</button>
    <p class="lock-err" id="lockErr" hidden></p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="filePicker" accept=".txt,.md,.json,.csv,.log,.js,.ts,.py,.html,.css" hidden />

<script type="module" src="./app.js"></script>
</body>
</html>
