<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="A.ForgeV" />
<meta name="mobile-web-app-capable" content="yes" />
<title>A.ForgeV</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body data-theme="light">

<!-- ============================ 侧栏 ============================ -->
<aside class="sidebar" id="sidebar" aria-label="会话列表">
  <div class="sb-head">
    <div class="sb-brand">
      <span class="sb-logo" aria-label="AFV">AFV</span>
      <span class="sb-ready" id="sbReady"><i class="dot"></i>SESSION READY</span>
    </div>
    <button class="sb-ghost" data-action="close-sidebar" aria-label="收起侧栏">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
    </button>
  </div>

  <div class="sb-plate" aria-hidden="true">
    <div class="sb-spine">FORGE VISION</div>
    <div class="sb-plate-inner">
      <div class="sb-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 38 24 8l16 30h-9l-7-13-7 13z" />
          <path d="M17 38h14" />
        </svg>
      </div>
      <div class="sb-plate-text">
        <strong>推想视限</strong>
        <span>LOCAL FIRST / v0.1</span>
      </div>
    </div>
  </div>

  <div class="sb-panel">
    <button class="sb-row" id="sbModelRow" title="选择模型">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v3M8 11v3M2 8h3M11 8h3" /><circle cx="8" cy="8" r="2.6" /></svg>
      <span class="sb-row-label">模型</span>
      <b class="sb-row-value" id="sbModel">—</b>
    </button>
  </div>

  <div class="sb-scroll">
    <div class="sb-group-head" id="sessHead">
      <span>对话</span>
    </div>
    <div class="sb-list" id="sessionList"></div>
    <div class="sb-empty" id="sessionEmpty" hidden>还没有对话</div>
  </div>

  <button class="sb-user" id="userRow" aria-label="设置">
    <span class="sb-avatar" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <rect x="0.5" y="0.5" width="39" height="39" fill="#ffffff" stroke="#d8dbe0" />
        <rect x="6" y="6" width="28" height="28" fill="#f1f2f4" />
        <rect x="17" y="11.5" width="6" height="6" fill="#5b6b86" />
        <path d="M12 29v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#5b6b86" stroke-width="2.6" stroke-linecap="round" />
      </svg>
    </span>
    <span class="sb-user-text">
      <b id="sbUserName">未登录</b>
      <span id="sbUserSub">点这里登录</span>
    </span>
    <span class="sb-gear" aria-hidden="true">
      <svg viewBox="0 0 20 20">
        <rect x="3.4" y="3.4" width="13.2" height="13.2" />
        <rect x="3.4" y="3.4" width="13.2" height="13.2" transform="rotate(45 10 10)" />
      </svg>
    </span>
  </button>
</aside>

<div class="scrim" id="scrim" hidden></div>

<!-- ============================ 主区 ============================ -->
<main class="main" id="main">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="菜单">
      <svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14" /></svg>
    </button>
    <div class="tb-title" id="chatTitle">新对话</div>
    <span class="tb-model" id="chatModel"></span>
    <div class="tb-actions">
      <button class="icon-btn" data-action="new-chat" aria-label="新对话">
        <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></svg>
      </button>
      <button class="icon-btn" id="moreBtn" aria-label="更多">
        <svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.4" /><circle cx="10" cy="10" r="1.4" /><circle cx="15" cy="10" r="1.4" /></svg>
      </button>
    </div>
  </header>

  <div class="chat-scroll" id="chatScroll">
    <section class="hero" id="hero">
      <div class="hero-eyebrow">
        <span class="hero-eyebrow-line"></span>
        <span>FORGEVISION</span>
        <span class="hero-eyebrow-line"></span>
      </div>
      <h1 class="hero-type">
        <span id="heroText"></span><i class="hero-caret" aria-hidden="true"></i>
      </h1>
      <div class="hero-meta"><span>AFV.01A</span><span class="hero-meta-rule"></span></div>
    </section>
    <div class="flow" id="flow"></div>
  </div>

  <div class="composer-seat" id="composerSeat">
    <div class="composer" id="composer">
      <div class="composer-edit" id="editHead" hidden>
        <span class="ce-title">修改输入</span>
        <button class="ce-close" id="editCancel" aria-label="取消修改">
          <svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15" /></svg>
        </button>
      </div>
      <div class="attach-tray" id="attachTray" hidden></div>
      <textarea id="input" rows="1" placeholder="给 A.ForgeV 发送消息…" enterkeyhint="send" autocomplete="off"></textarea>
      <div class="composer-tools">
        <div class="ct-left">
          <button class="tool-btn" id="attachBtn" title="添加文件（docx / 图片 / 文本）">
            <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></svg>
          </button>
          <button class="tool-btn search-btn" id="webSearchBtn" aria-pressed="false" title="联网搜索">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M3 10h14" /><path d="M10 3c2.4 2.5 2.4 11.5 0 14M10 3c-2.4 2.5-2.4 11.5 0 14" /></svg>
            <span>联网搜索</span>
          </button>
        </div>
        <div class="ct-right">
          <button class="send-btn" id="stopBtn" hidden title="停止生成">
            <svg viewBox="0 0 20 20"><rect x="6" y="6" width="8" height="8" rx="0.5" /></svg>
          </button>
          <button class="send-btn" id="sendBtn" title="发送" disabled>
            <svg viewBox="0 0 20 20"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5" /></svg>
          </button>
        </div>
      </div>
    </div>
    <p class="disclaimer">内容由 AI 生成，请仔细甄别</p>
  </div>
</main>

<!-- ============================ 设置 ============================ -->
<div class="page page-tinted" id="settingsPage" hidden>
  <header class="page-head">
    <button class="page-back" id="settingsBack" aria-label="返回">
      <svg viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" /></svg>
    </button>
    <h2>设置</h2>
  </header>
  <div class="page-body page-body--settings">
    <section class="set-section">
      <div class="set-section-title">账户</div>
      <div class="set-group">
        <button class="set-item" data-open="account">
          <span class="set-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4.5 20.5c.6-3.8 3.6-6 7.5-6s6.9 2.2 7.5 6" /></svg></span>
          <span class="set-label">账号</span>
          <i id="setAccountValue">未登录</i>
          <span class="chev">›</span>
        </button>
        <button class="set-item" data-open="models">
          <span class="set-icon"><svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="9" height="9" /><rect x="3" y="8.5" width="9" height="9" /><rect x="12" y="12" width="9" height="9" /></svg></span>
          <span class="set-label">模型</span>
          <i id="setModelValue">—</i>
          <span class="chev">›</span>
        </button>
        <button class="set-item" data-open="data">
          <span class="set-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" /><rect x="3" y="13" width="18" height="7" /><path d="M6.5 7.5h.01M6.5 16.5h.01" /></svg></span>
          <span class="set-label">数据</span>
          <span class="chev">›</span>
        </button>
      </div>
    </section>

    <section class="set-section">
      <div class="set-section-title">应用</div>
      <div class="set-group">
        <button class="set-item" data-open="language">
          <span class="set-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" /></svg></span>
          <span class="set-label">语言</span>
          <span class="chev">›</span>
        </button>
        <button class="set-item" data-open="appearance">
          <span class="set-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" /></svg></span>
          <span class="set-label">外观</span>
          <span class="chev">›</span>
        </button>
        <button class="set-item" data-open="font">
          <span class="set-icon"><svg viewBox="0 0 24 24"><text x="1.5" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="currentColor" stroke="none">A</text><text x="9.5" y="19.5" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="currentColor" stroke="none">A</text></svg></span>
          <span class="set-label">字体大小</span>
          <span class="chev">›</span>
        </button>
        <button class="set-item" data-open="terms">
          <span class="set-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" /><path d="M14 3v4h4" /><path d="M9.5 12h5M9.5 16h3.5" /></svg></span>
          <span class="set-label">服务协议</span>
          <span class="chev">›</span>
        </button>
        <button class="set-item" data-open="help">
          <span class="set-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.4a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.2 1-1.2 1.8v.4" /><path d="M12 17.2h.01" /></svg></span>
          <span class="set-label">帮助与反馈</span>
          <span class="chev">›</span>
        </button>
      </div>
    </section>

    <section class="set-section">
      <div class="set-section-title">其他</div>
      <div class="set-group">
        <button class="set-item" data-open="update">
          <span class="set-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.3h.01" /></svg></span>
          <span class="set-label">检查更新</span>
          <i id="setVersionValue">v0.1.0-rc.2</i>
          <span class="chev">›</span>
        </button>
        <button class="set-item" id="logoutBtn">
          <span class="set-icon"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5" /><path d="M10 12H3M6.5 8.5 3 12l3.5 3.5" /></svg></span>
          <span class="set-label danger">退出登录</span>
        </button>
      </div>
    </section>
  </div>
</div>

<!-- ============================ 设置子页 ============================ -->
<div class="page page-tinted" id="subPage" hidden>
  <header class="page-head">
    <button class="page-back" id="subBack" aria-label="返回">
      <svg viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" /></svg>
    </button>
    <h2 id="subTitle">—</h2>
  </header>
  <div class="page-body" id="subBody"></div>
</div>

<!-- ============================ 登录 ============================ -->
<div class="page login" id="loginPage" hidden>
  <header class="page-head">
    <button class="page-back" id="loginBack" aria-label="返回">
      <svg viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" /></svg>
    </button>
    <h2 id="loginPageTitle">登录</h2>
  </header>

  <div class="login-body">
    <div class="login-brand">
      <span class="login-logo">AFV</span>
      <h1 id="loginHeading">登录 A.ForgeV</h1>
      <p id="loginSub">手机号或邮箱都可以，登录只用来区分账户，对话仍然只存在这台设备。</p>
    </div>

    <div class="login-tabs" id="loginTabs">
      <button data-channel="phone" aria-pressed="true">手机号登录</button>
      <button data-channel="email" aria-pressed="false">邮箱登录</button>
    </div>

    <div class="login-form">
      <div class="field" id="phoneField">
        <span class="field-prefix">+86</span>
        <input id="loginPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel" />
      </div>
      <div class="field" id="emailField" hidden>
        <input id="loginEmail" type="email" placeholder="请输入邮箱地址" autocomplete="email" spellcheck="false" />
      </div>

      <div class="field code-field">
        <input id="loginCode" type="tel" inputmode="numeric" maxlength="6" placeholder="请输入验证码" autocomplete="one-time-code" />
        <button class="code-btn" id="sendCodeBtn">获取验证码</button>
      </div>

      <p class="login-hint" id="loginHint" hidden></p>

      <label class="agree">
        <input type="checkbox" id="agreeBox" />
        <span>我已阅读并同意 <b>《用户协议》</b> 和 <b>《隐私政策》</b></span>
      </label>

      <button class="primary" id="loginSubmit">登录</button>
      <p class="login-note">本机演示环境：验证码会直接显示在上方。</p>
    </div>
  </div>
</div>

<!-- ============================ 服务密码锁 ============================ -->
<div class="lock" id="lock" hidden>
  <div class="lock-card">
    <div class="lock-logo">AFV</div>
    <h2>推想视限</h2>
    <p>输入访问密码继续</p>
    <input id="lockInput" type="password" placeholder="访问密码" autocomplete="current-password" />
    <button id="lockBtn">进入</button>
    <p class="lock-err" id="lockErr" hidden></p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- ============================ 更新提示 ============================ -->
<div class="update-pop" id="updatePop" hidden>
  <div class="update-mask" id="updateMask"></div>
  <div class="update-card">
    <p class="update-title">有更新版本</p>
    <p class="update-version" id="updateVersion"></p>
    <button class="update-btn" id="updateGo">更新</button>
    <button class="update-later" id="updateLater">以后再说</button>
  </div>
</div>

<!-- ============================ 语言选择 ============================ -->
<div class="sheet" id="langSheet" hidden>
  <div class="sheet-mask" id="langMask"></div>
  <div class="sheet-card">
    <div class="sheet-head">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" /></svg>
      <span>语言</span>
    </div>
    <div class="sheet-list" id="langList"></div>
    <button class="sheet-confirm" id="langConfirm">确认</button>
  </div>
</div>

<input type="file" id="filePicker" hidden />

<!-- 重命名对话 -->
<div class="modal-layer" id="renameLayer" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h3 class="modal-title">重命名对话</h3>
    <input class="modal-input" id="renameInput" autocomplete="off" spellcheck="false" />
    <div class="modal-actions">
      <button id="renameCancel">取消</button>
      <button id="renameOk">确认</button>
    </div>
  </div>
</div>

<!-- 老设备兜底：WebView 内核太旧时 ES module 不会执行，会白屏 -->
<script>
  (function () {
    var m = navigator.userAgent.match(/Chrome\/(\d+)/);
    var v = m ? parseInt(m[1], 10) : 999;
    if (v >= 80) return;
    var box = document.createElement('div');
    box.style.cssText =
      'position:fixed;inset:0;z-index:99999;background:#fff;color:#17181c;' +
      'display:flex;align-items:center;justify-content:center;padding:32px;' +
      'text-align:center;font:15px/1.8 sans-serif;';
    box.innerHTML =
      '<div><p style="font-size:17px;font-weight:600;margin:0 0 12px">WebView 内核太旧</p>' +
      '<p style="margin:0;opacity:.72">当前内核 Chrome ' + v + '，最低需要 80。<br>' +
      '请在应用商店更新「Android System WebView」或「Chrome」后再打开。</p></div>';
    document.body.appendChild(box);
  })();
</script>

<script type="module" src="./app.js"></script>
</body>
</html>
